name: Enrich Apple TV movies with TMDB

on:
  push:
    paths:
      - movies.json
      - movie-overrides.json
      - scripts/tv_enrich.py
      - tests/**
      - .github/workflows/enrich.yml
  workflow_dispatch:
    inputs:
      refresh:
        description: Refresh TMDB details even when recently checked
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '27 5 * * 1'

permissions:
  contents: write

concurrency:
  group: tmdb-enrichment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python (standard library only)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v

      - name: Enrich catalog using TMDB
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          REFRESH_REQUESTED: ${{ inputs.refresh || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$TMDB_READ_TOKEN" ]]; then
            echo "Missing repository Actions secret: TMDB_READ_TOKEN" >&2
            exit 1
          fi
          args=(
            --input movies.json
            --out movies-enriched.json
            --review movies-review.json
            --overrides movie-overrides.json
            --language de-DE
            --quiet
          )
          if [[ "$REFRESH_REQUESTED" == "true" ]]; then
            args+=(--refresh)
          fi
          python scripts/tv_enrich.py "${args[@]}"

      - name: Validate enriched output before committing
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          source = json.loads(Path('movies.json').read_text(encoding='utf-8'))
          enriched = json.loads(Path('movies-enriched.json').read_text(encoding='utf-8'))
          review = json.loads(Path('movies-review.json').read_text(encoding='utf-8'))
          assert enriched['count'] == len(source['movies']) == len(enriched['movies'])
          assert review['count'] == len(review['review'])
          assert all(isinstance(m['title'], str) and m['title'] for m in enriched['movies'])
          assert enriched['matched_count'] + enriched['review_count'] <= enriched['count']
          print(f"Validated {enriched['count']} entries; {enriched['matched_count']} matched; {review['count']} to review")
          PY

      - name: Commit generated JSON only when changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- movies-enriched.json movies-review.json
          if git diff --cached --quiet; then
            echo 'Enriched metadata unchanged; no commit needed'
            exit 0
          fi
          git commit -m 'Update TMDB movie metadata'
          git push origin "HEAD:${GITHUB_REF_NAME}"
